# Namespace-scoped RoleBindings (no ClusterRoleBindings)
# Each RoleBinding binds a ServiceAccount to its corresponding Role within the same namespace
# This ensures Secret access is restricted to same-namespace ServiceAccounts only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-rolebinding
  namespace: observability
  labels:
    app: prometheus
    managed-by: platform-stack
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
roleRef:
  kind: Role
  name: prometheus-role
  apiGroup: rbac.authorization.k8s.io
