# ServiceAccounts — one per workload/component in each managed namespace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
    managed-by: platform-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
    managed-by: platform-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-server
  namespace: temporal
  labels:
    app: temporal-server
    managed-by: platform-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-worker
  namespace: temporal
  labels:
    app: temporal-worker
    managed-by: platform-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-api
  namespace: applications
  labels:
    app: sample-api
    managed-by: platform-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sre-agent
  namespace: ai-sre
  labels:
    app: ai-sre-agent
    managed-by: platform-stack
