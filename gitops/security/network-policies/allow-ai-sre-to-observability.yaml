apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-sre-query-prometheus
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ai-sre
          podSelector:
            matchLabels:
              app: ai-sre-agent
      ports:
        - port: 9090
          protocol: TCP
---
