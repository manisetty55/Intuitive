apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sre-agent-config
  namespace: ai-sre
  labels:
    app: ai-sre-agent
data:
  PROMETHEUS_URL: "http://prometheus-server.observability.svc.cluster.local:9090"
  LOKI_URL: "http://loki.observability.svc.cluster.local:3100"
  TEMPO_URL: "http://tempo.observability.svc.cluster.local:3200"
  REPORTS_DIR: "/reports"
  POLLING_INTERVAL_SECONDS: "30"
  LLM_MODEL: "gpt-4o-mini"
